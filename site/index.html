<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oil Price Monitor</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #0b0b0b;
      --amber: #ffa028;
      --text: #e6e6e6;
      --muted: #8a8a8a;
      --grid: #222222;
      --brent: #ffa028;
      --wti: #4fb3ff;
      --event: #ff3b3b;
      --real: #3ddc84;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding-block: 12px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      border-bottom: 1px solid var(--grid);
      background: var(--panel);
    }
    h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0.08em;
      color: var(--amber);
      text-transform: uppercase;
    }
    .quotes { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 13px; }
    .quotes b { color: var(--amber); font-weight: 600; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      padding-block: 12px 0;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    button {
      font: inherit;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 8px 14px;
      background: #1a1a1a;
      color: var(--amber);
      border: 1px solid var(--amber);
      cursor: pointer;
    }
    button:hover { background: #262626; }
    button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    #events-btn[aria-pressed="true"] { background: var(--event); border-color: var(--event); color: #000; }
    #real-btn[aria-pressed="true"] { background: var(--real); border-color: var(--real); color: #000; }
    #compare-btn[aria-pressed="true"] { background: var(--amber); color: #000; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    #live-btn { border-color: var(--real); color: var(--real); }
    #live-btn[aria-pressed="true"] { background: var(--real); color: #000; }
    .live-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--real); margin-right: 6px; vertical-align: middle;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
    .up { color: var(--real); }
    .down { color: var(--event); }
    #mode { font-size: 12px; color: var(--muted); }
    #chart { width: 100%; height: calc(100vh - 150px); min-height: 420px; }
    footer {
      padding-block: 4px 12px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>Crude Oil &middot; Brent / WTI</h1>
    <div class="quotes" id="quotes"></div>
  </header>

  <div class="toolbar">
    <button id="events-btn" aria-pressed="false">Major Events</button>
    <button id="real-btn" aria-pressed="false">Inflation Adj</button>
    <button id="compare-btn" aria-pressed="false">Compare</button>
    <!-- Only appears when live.json exists, i.e. when src/live_server.py is running. -->
    <button id="live-btn" aria-pressed="false" hidden>Live 5D</button>
    <span id="mode"></span>
  </div>

  <div id="chart"></div>
  <footer id="footer"></footer>

  <!-- Plotly: the charting library (zoom, hover, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
  <!-- Our data, generated by src/build_site_data.py -->
  <script src="data.js"></script>
  <script>
  // If data.js didn't load (e.g. the online version), fetch data.json instead.
  const loadData = window.OIL_DATA
    ? Promise.resolve(window.OIL_DATA)
    : fetch("data.json").then(r => r.json());

  loadData.then(D => {
    const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const DAY = 24 * 3600 * 1000;

    // ---- What is switched on. Every button click changes this, then redraws.
    const state = { events: false, real: false, compare: false, live: false };

    // Live prices from Yahoo (filled in by pollLive below, if live_server.py is running).
    let LIVE = null;

    // ---- Header: latest prices -------------------------------------------
    const last = arr => { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return arr[i]; };
    function updateQuotes() {
      const q = document.getElementById("quotes");
      if (!LIVE) {
        q.innerHTML =
          `<span>BRENT <b>$${last(D.brent).toFixed(2)}</b></span>` +
          `<span>WTI <b>$${last(D.wti).toFixed(2)}</b></span>` +
          `<span>AS OF ${D.last_date}</span>`;
        return;
      }
      const quote = (label, x) => {
        const pct = (x.last / x.prev_close - 1) * 100;
        const cls = pct >= 0 ? "up" : "down";
        return `<span>${label} <b>$${x.last.toFixed(2)}</b> ` +
          `<span class="${cls}">${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%</span></span>`;
      };
      q.innerHTML =
        `<span><span class="live-dot"></span>LIVE</span>` +
        quote("BRENT", LIVE.brent) + quote("WTI", LIVE.wti) +
        `<span>${LIVE.brent.last_time.slice(11)} NEW YORK</span>`;
    }
    updateQuotes();
    const dailyFooter =
      `Source: ${D.source}. Daily closing prices in US$ per barrel. ` +
      `Inflation-adjusted prices use US CPI and are expressed in ${D.real_base} dollars.`;

    // Pick nominal ("as it was on the day") or real ("in today's dollars") prices.
    // (In Compare mode the main lines are always the nominal ones.)
    const series = name => state.real && !state.compare ? D[name + "_real"] : D[name];

    // The "delta": how many dollars inflation adds to each day's Brent price,
    // and the same as a percentage (= total US inflation since that day).
    const deltaUsd = D.brent.map((v, i) => v == null ? null : +(D.brent_real[i] - v).toFixed(2));
    const deltaPct = D.brent.map((v, i) => v == null ? null : (D.brent_real[i] / v - 1) * 100);

    // Brent price on an event date (or the next trading day), to place the red diamond.
    const priceOn = (values, date) => {
      const i = D.dates.findIndex(d => d >= date);
      for (let j = i; j < values.length; j++) if (values[j] != null) return values[j];
    };

    // Event labels go right of the line, or left if the next event is close.
    const nextIsClose = i => i + 1 < D.events.length &&
      (new Date(D.events[i + 1].date) - new Date(D.events[i].date)) / DAY < 200;

    function compareTraces() {
      return [
        {
          name: "Brent (as on the day)", x: D.dates, y: D.brent, type: "scatter", mode: "lines",
          line: { color: css("--brent"), width: 1.3 }, connectgaps: true,
          hovertemplate: "As on the day: $%{y:.2f}<extra></extra>",
        },
        {
          name: `Brent (${D.real_base} dollars)`, x: D.dates, y: D.brent_real, type: "scatter", mode: "lines",
          line: { color: css("--real"), width: 1.3 }, connectgaps: true,
          // Shade the gap between this line and the previous one.
          fill: "tonexty", fillcolor: "rgba(61, 220, 132, 0.12)",
          customdata: deltaUsd.map((v, i) => [v, deltaPct[i]]),
          hovertemplate: `In ${D.real_base} dollars: $%{y:.2f}<br>` +
            "Delta: +$%{customdata[0]:.2f} (+%{customdata[1]:.0f}%)<extra></extra>",
        },
        {
          name: "Inflation delta", x: D.dates, y: deltaUsd, yaxis: "y2", type: "scatter", mode: "lines",
          line: { color: css("--real"), width: 1 }, connectgaps: true,
          fill: "tozeroy", fillcolor: "rgba(61, 220, 132, 0.25)", showlegend: false,
          customdata: deltaPct,
          hovertemplate: "Delta: +$%{y:.2f} (+%{customdata:.0f}%)<extra></extra>",
        },
      ];
    }

    function buildTraces() {
      if (state.compare) return [...compareTraces(), ...eventTraces()];
      const suffix = state.real ? " (real)" : "";
      const line = (name, values, color) => ({
        name: name + suffix, x: D.dates, y: values, type: "scatter", mode: "lines",
        line: { color, width: 1.3 },
        hovertemplate: `${name}: $%{y:.2f}<extra></extra>`,
      });
      const traces = [
        line("Brent", series("brent"), css("--brent")),
        line("WTI", series("wti"), css("--wti")),
      ];
      return [...traces, ...eventTraces()];
    }

    function eventTraces() {
      if (!state.events) return [];
      return [{
          type: "scatter", mode: "markers", showlegend: false,
          x: D.events.map(e => e.date),
          y: D.events.map(e => priceOn(series("brent"), e.date)),
          marker: { color: css("--event"), size: 9, symbol: "diamond", line: { color: "#000", width: 1 } },
          customdata: D.events.map(e => [e.label, e.description]),
          hovertemplate: "<b>%{customdata[0]}</b><br>%{x}<br>%{customdata[1]}<extra></extra>",
      }];
    }

    function buildLayout(xRange) {
      const shown = state.compare ? [D.brent_real] : [series("brent"), series("wti")];
      const peak = Math.max(...shown.flat().filter(v => v != null));
      const layout = {
        paper_bgcolor: css("--bg"), plot_bgcolor: css("--bg"),
        font: { color: css("--text"), family: getComputedStyle(document.body).fontFamily, size: 12 },
        margin: { l: 56, r: 24, t: 16, b: 40 },
        hovermode: "x unified",
        hoverlabel: { bgcolor: "#111", bordercolor: css("--amber") },
        legend: { orientation: "h", x: 0, y: 1.06, traceorder: "normal" },
        xaxis: {
          type: "date", gridcolor: css("--grid"), linecolor: css("--grid"),
          range: xRange,
          rangeselector: {
            x: 1, xanchor: "right", y: 1.06,
            bgcolor: "#1a1a1a", activecolor: "#3a3a3a", font: { color: css("--amber") },
            buttons: [
              { count: 1, label: "1Y", step: "year", stepmode: "backward" },
              { count: 5, label: "5Y", step: "year", stepmode: "backward" },
              { count: 10, label: "10Y", step: "year", stepmode: "backward" },
              { step: "all", label: "MAX" },
            ],
          },
        },
        yaxis: {
          title: state.real ? `US$ / barrel (${D.real_base} dollars)` : "US$ / barrel",
          gridcolor: css("--grid"), zerolinecolor: "#555", tickprefix: "$",
          // With events on, leave empty space above the prices for the red labels.
          ...(state.events ? { range: [-45, peak * 1.75], autorange: false } : { autorange: true }),
        },
        shapes: !state.events ? [] : D.events.map(e => ({
          type: "line", xref: "x", yref: "paper", x0: e.date, x1: e.date, y0: 0, y1: 1,
          line: { color: css("--event"), width: 1, dash: "dot" },
        })),
        annotations: !state.events ? [] : D.events.map((e, i) => ({
          x: e.date, xref: "x", y: 1, yref: "paper", yanchor: "top",
          xanchor: nextIsClose(i) ? "right" : "left",
          text: e.label, textangle: -90, showarrow: false,
          font: { color: css("--event"), size: 10 },
        })),
      };

      if (state.compare) {
        // Two panels sharing the same time axis: prices on top, delta below.
        layout.yaxis.title = "US$ / barrel";
        layout.yaxis.domain = [0.34, 1];
        layout.yaxis2 = {
          domain: [0, 0.26], anchor: "x", title: "Delta (US$)",
          gridcolor: css("--grid"), tickprefix: "+$", rangemode: "tozero",
        };
        layout.xaxis.anchor = "y2";
        if (state.events) layout.yaxis.range = [0, peak * 1.75];
      }
      return layout;
    }

    // ---- Live view: the last 5 days in 15-minute steps ---------------------
    function liveTraces() {
      const line = (name, x, color) => ({
        name: name + " futures", x: x.times, y: x.prices, type: "scatter", mode: "lines",
        line: { color, width: 1.5 },
        hovertemplate: `${name}: $%{y:.2f}<extra></extra>`,
      });
      return [line("Brent", LIVE.brent, css("--brent")), line("WTI", LIVE.wti, css("--wti"))];
    }

    function liveLayout() {
      const layout = buildLayout(undefined);
      layout.xaxis.rangeselector = { visible: false };
      layout.yaxis = { title: "US$ / barrel", gridcolor: css("--grid"), tickprefix: "$", autorange: true };
      layout.shapes = [];
      layout.annotations = [];
      return layout;
    }

    const chart = document.getElementById("chart");
    let wasLive = false;
    function render() {
      const config = { responsive: true, displayModeBar: false };
      const others = ["events-btn", "real-btn", "compare-btn"].map(id => document.getElementById(id));
      if (state.live) {
        Plotly.react(chart, liveTraces(), liveLayout(), config);
        const updated = new Date(LIVE.updated).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        document.getElementById("mode").textContent =
          `${LIVE.source}. Last fetched at ${updated} your time.`;
        others.forEach(b => b.disabled = true);
        document.getElementById("footer").textContent =
          "Front-month futures prices, New York time. Brent: ICE; WTI: NYMEX. " +
          "Change % is versus the previous trading day's last price.";
        wasLive = true;
        return;
      }
      others.forEach(b => b.disabled = false);
      document.getElementById("footer").textContent = dailyFooter;
      // Keep the current zoom when switching modes (but not when leaving the live view).
      const xRange = chart.layout && !wasLive ? chart.layout.xaxis.range : undefined;
      wasLive = false;
      Plotly.react(chart, buildTraces(), buildLayout(xRange), config);
      document.getElementById("mode").textContent = state.compare
        ? `Comparing Brent as on the day vs in ${D.real_base} dollars; bottom panel = the difference`
        : state.real
          ? `Showing prices in ${D.real_base} dollars`
          : "Showing prices as they were on the day";
      // Inflation Adj doesn't apply in Compare mode (Compare already shows both).
      document.getElementById("real-btn").disabled = state.compare;
    }

    // ---- Buttons ---------------------------------------------------------
    function toggle(button, key) {
      button.addEventListener("click", () => {
        state[key] = !state[key];
        button.setAttribute("aria-pressed", String(state[key]));
        render();
      });
    }
    toggle(document.getElementById("events-btn"), "events");
    toggle(document.getElementById("real-btn"), "real");
    toggle(document.getElementById("compare-btn"), "compare");
    toggle(document.getElementById("live-btn"), "live");

    // ---- Check for live prices every minute ------------------------------
    // live_server.py rewrites live.json every 15 minutes; checking every
    // minute means the page shows new prices soon after they arrive.
    async function pollLive() {
      try {
        const response = await fetch("live.json", { cache: "no-store" });
        if (!response.ok) return;  // live server not running: stay on daily data
        const fresh = await response.json();
        const changed = !LIVE || fresh.updated !== LIVE.updated;
        LIVE = fresh;
        document.getElementById("live-btn").hidden = false;
        updateQuotes();
        if (changed && state.live) render();
      } catch (error) {
        // Opened as a file, or offline: live prices aren't available.
      }
    }

    render();
    pollLive();
    setInterval(pollLive, 60 * 1000);
  });
  </script>
</body>
</html>
