<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oil Price Monitor</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #0b0b0b;
      --amber: #ffa028;
      --text: #e6e6e6;
      --muted: #8a8a8a;
      --grid: #222222;
      --brent: #ffa028;
      --wti: #4fb3ff;
      --event: #ff3b3b;
      --real: #3ddc84;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding-block: 12px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      border-bottom: 1px solid var(--grid);
      background: var(--panel);
    }
    h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0.08em;
      color: var(--amber);
      text-transform: uppercase;
    }
    .quotes { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 13px; }
    .quotes b { color: var(--amber); font-weight: 600; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      padding-block: 12px 0;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    button {
      font: inherit;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 8px 14px;
      background: #1a1a1a;
      color: var(--amber);
      border: 1px solid var(--amber);
      cursor: pointer;
    }
    button:hover { background: #262626; }
    button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    #events-btn[aria-pressed="true"] { background: var(--event); border-color: var(--event); color: #000; }
    #real-btn[aria-pressed="true"] { background: var(--real); border-color: var(--real); color: #000; }
    #mode { font-size: 12px; color: var(--muted); }
    #chart { width: 100%; height: calc(100vh - 150px); min-height: 420px; }
    footer {
      padding-block: 4px 12px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>Crude Oil &middot; Brent / WTI</h1>
    <div class="quotes" id="quotes"></div>
  </header>

  <div class="toolbar">
    <button id="events-btn" aria-pressed="false">Major Events</button>
    <button id="real-btn" aria-pressed="false">Inflation Adj</button>
    <span id="mode"></span>
  </div>

  <div id="chart"></div>
  <footer id="footer"></footer>

  <!-- Plotly: the charting library (zoom, hover, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
  <!-- Our data, generated by src/build_site_data.py -->
  <script src="data.js"></script>
  <script>
  // If data.js didn't load (e.g. the online version), fetch data.json instead.
  const loadData = window.OIL_DATA
    ? Promise.resolve(window.OIL_DATA)
    : fetch("data.json").then(r => r.json());

  loadData.then(D => {
    const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const DAY = 24 * 3600 * 1000;

    // ---- What is switched on. Every button click changes this, then redraws.
    const state = { events: false, real: false };

    // ---- Header: latest prices -------------------------------------------
    const last = arr => { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return arr[i]; };
    document.getElementById("quotes").innerHTML =
      `<span>BRENT <b>$${last(D.brent).toFixed(2)}</b></span>` +
      `<span>WTI <b>$${last(D.wti).toFixed(2)}</b></span>` +
      `<span>AS OF ${D.last_date}</span>`;
    document.getElementById("footer").textContent =
      `Source: ${D.source}. Daily closing prices in US$ per barrel. ` +
      `Inflation-adjusted prices use US CPI and are expressed in ${D.real_base} dollars.`;

    // Pick nominal ("as it was on the day") or real ("in today's dollars") prices.
    const series = name => state.real ? D[name + "_real"] : D[name];

    // Brent price on an event date (or the next trading day), to place the red diamond.
    const priceOn = (values, date) => {
      const i = D.dates.findIndex(d => d >= date);
      for (let j = i; j < values.length; j++) if (values[j] != null) return values[j];
    };

    // Event labels go right of the line, or left if the next event is close.
    const nextIsClose = i => i + 1 < D.events.length &&
      (new Date(D.events[i + 1].date) - new Date(D.events[i].date)) / DAY < 200;

    function buildTraces() {
      const suffix = state.real ? " (real)" : "";
      const line = (name, values, color) => ({
        name: name + suffix, x: D.dates, y: values, type: "scatter", mode: "lines",
        line: { color, width: 1.3 },
        hovertemplate: `${name}: $%{y:.2f}<extra></extra>`,
      });
      const traces = [
        line("Brent", series("brent"), css("--brent")),
        line("WTI", series("wti"), css("--wti")),
      ];
      if (state.events) {
        traces.push({
          type: "scatter", mode: "markers", showlegend: false,
          x: D.events.map(e => e.date),
          y: D.events.map(e => priceOn(series("brent"), e.date)),
          marker: { color: css("--event"), size: 9, symbol: "diamond", line: { color: "#000", width: 1 } },
          customdata: D.events.map(e => [e.label, e.description]),
          hovertemplate: "<b>%{customdata[0]}</b><br>%{x}<br>%{customdata[1]}<extra></extra>",
        });
      }
      return traces;
    }

    function buildLayout(xRange) {
      const peak = Math.max(...series("brent").filter(v => v != null), ...series("wti").filter(v => v != null));
      return {
        paper_bgcolor: css("--bg"), plot_bgcolor: css("--bg"),
        font: { color: css("--text"), family: getComputedStyle(document.body).fontFamily, size: 12 },
        margin: { l: 56, r: 24, t: 16, b: 40 },
        hovermode: "x unified",
        hoverlabel: { bgcolor: "#111", bordercolor: css("--amber") },
        legend: { orientation: "h", x: 0, y: 1.06 },
        xaxis: {
          type: "date", gridcolor: css("--grid"), linecolor: css("--grid"),
          range: xRange,
          rangeselector: {
            x: 1, xanchor: "right", y: 1.06,
            bgcolor: "#1a1a1a", activecolor: "#3a3a3a", font: { color: css("--amber") },
            buttons: [
              { count: 1, label: "1Y", step: "year", stepmode: "backward" },
              { count: 5, label: "5Y", step: "year", stepmode: "backward" },
              { count: 10, label: "10Y", step: "year", stepmode: "backward" },
              { step: "all", label: "MAX" },
            ],
          },
        },
        yaxis: {
          title: state.real ? `US$ / barrel (${D.real_base} dollars)` : "US$ / barrel",
          gridcolor: css("--grid"), zerolinecolor: "#555", tickprefix: "$",
          // With events on, leave empty space above the prices for the red labels.
          ...(state.events ? { range: [-45, peak * 1.75], autorange: false } : { autorange: true }),
        },
        shapes: !state.events ? [] : D.events.map(e => ({
          type: "line", xref: "x", yref: "paper", x0: e.date, x1: e.date, y0: 0, y1: 1,
          line: { color: css("--event"), width: 1, dash: "dot" },
        })),
        annotations: !state.events ? [] : D.events.map((e, i) => ({
          x: e.date, xref: "x", y: 1, yref: "paper", yanchor: "top",
          xanchor: nextIsClose(i) ? "right" : "left",
          text: e.label, textangle: -90, showarrow: false,
          font: { color: css("--event"), size: 10 },
        })),
      };
    }

    const chart = document.getElementById("chart");
    function render() {
      // Keep the current zoom when switching modes.
      const xRange = chart.layout ? chart.layout.xaxis.range : undefined;
      Plotly.react(chart, buildTraces(), buildLayout(xRange), { responsive: true, displaylogo: false });
      document.getElementById("mode").textContent = state.real
        ? `Showing prices in ${D.real_base} dollars`
        : "Showing prices as they were on the day";
    }

    // ---- Buttons ---------------------------------------------------------
    function toggle(button, key) {
      button.addEventListener("click", () => {
        state[key] = !state[key];
        button.setAttribute("aria-pressed", String(state[key]));
        render();
      });
    }
    toggle(document.getElementById("events-btn"), "events");
    toggle(document.getElementById("real-btn"), "real");

    render();
  });
  </script>
</body>
</html>
