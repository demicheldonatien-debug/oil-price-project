<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oil Price Monitor</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #0b0b0b;
      --amber: #ffa028;
      --text: #e6e6e6;
      --muted: #8a8a8a;
      --grid: #222222;
      --brent: #ffa028;
      --wti: #4fb3ff;
      --event: #ff3b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-bottom: 1px solid var(--grid);
      background: var(--panel);
    }
    h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0.08em;
      color: var(--amber);
      text-transform: uppercase;
    }
    .quotes { display: flex; gap: 24px; font-size: 13px; }
    .quotes span b { color: var(--amber); font-weight: 600; }
    .toolbar { padding: 12px 16px 0; }
    button {
      font: inherit;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 8px 14px;
      background: #1a1a1a;
      color: var(--amber);
      border: 1px solid var(--amber);
      cursor: pointer;
    }
    button:hover { background: #262626; }
    button[aria-pressed="true"] {
      background: var(--event);
      border-color: var(--event);
      color: #000;
    }
    #chart { width: 100%; height: calc(100vh - 140px); min-height: 420px; }
    footer { padding: 4px 16px 12px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Crude Oil &middot; Brent / WTI</h1>
    <div class="quotes" id="quotes"></div>
  </header>

  <div class="toolbar">
    <button id="events-btn" aria-pressed="false">Major Events</button>
  </div>

  <div id="chart"></div>
  <footer id="footer"></footer>

  <!-- Plotly: the charting library (zoom, hover, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
  <!-- Our data, generated by src/build_site_data.py -->
  <script src="data.js"></script>
  <script>
    const D = window.OIL_DATA;
    const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

    // ---- Header: latest prices -------------------------------------------
    const last = arr => { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return arr[i]; };
    document.getElementById("quotes").innerHTML =
      `<span>BRENT <b>$${last(D.brent).toFixed(2)}</b></span>` +
      `<span>WTI <b>$${last(D.wti).toFixed(2)}</b></span>` +
      `<span>AS OF ${D.last_date}</span>`;
    document.getElementById("footer").textContent =
      `Source: ${D.source}. Daily closing prices in US$ per barrel.`;

    // ---- The two price lines ---------------------------------------------
    const priceLine = (name, values, color) => ({
      name, x: D.dates, y: values, type: "scatter", mode: "lines",
      line: { color, width: 1.3 },
      hovertemplate: `${name}: $%{y:.2f}<extra></extra>`,
    });

    const traces = [
      priceLine("Brent", D.brent, css("--brent")),
      priceLine("WTI", D.wti, css("--wti")),
    ];

    // ---- Events: red dots on the Brent line (hidden until button pressed) --
    const brentOn = date => {
      // Find the Brent price on the event date (or the next trading day).
      const i = D.dates.findIndex(d => d >= date);
      for (let j = i; j < D.brent.length; j++) if (D.brent[j] != null) return D.brent[j];
    };
    traces.push({
      name: "Events", type: "scatter", mode: "markers", visible: false,
      x: D.events.map(e => e.date),
      y: D.events.map(e => brentOn(e.date)),
      marker: { color: css("--event"), size: 9, symbol: "diamond", line: { color: "#000", width: 1 } },
      customdata: D.events.map(e => [e.label, e.description]),
      hovertemplate: "<b>%{customdata[0]}</b><br>%{x}<br>%{customdata[1]}<extra></extra>",
      showlegend: false,
    });
    const EVENT_TRACE = traces.length - 1;

    // Vertical red lines + labels for each event.
    const eventShapes = D.events.map(e => ({
      type: "line", xref: "x", yref: "paper", x0: e.date, x1: e.date, y0: 0, y1: 1,
      line: { color: css("--event"), width: 1, dash: "dot" },
    }));
    const DAY = 24 * 3600 * 1000;
    const nextIsClose = i => i + 1 < D.events.length &&
      (new Date(D.events[i + 1].date) - new Date(D.events[i].date)) / DAY < 200;
    const eventLabels = D.events.map((e, i) => ({
      x: e.date, xref: "x", y: 1, yref: "paper", yanchor: "top",
      // Text goes to the right of the line, unless the next event is close
      // (under ~200 days), in which case it goes to the left so they don't overlap.
      xanchor: nextIsClose(i) ? "right" : "left",
      text: e.label, textangle: -90, showarrow: false,
      font: { color: css("--event"), size: 10 },
    }));

    // ---- Layout: the look of the chart -----------------------------------
    const layout = {
      paper_bgcolor: css("--bg"), plot_bgcolor: css("--bg"),
      font: { color: css("--text"), family: getComputedStyle(document.body).fontFamily, size: 12 },
      margin: { l: 56, r: 24, t: 16, b: 40 },
      hovermode: "x unified",
      hoverlabel: { bgcolor: "#111", bordercolor: css("--amber") },
      legend: { orientation: "h", x: 0, y: 1.06 },
      xaxis: {
        type: "date", gridcolor: css("--grid"), linecolor: css("--grid"),
        rangeselector: {
          x: 1, xanchor: "right", y: 1.06,
          bgcolor: "#1a1a1a", activecolor: "#3a3a3a", font: { color: css("--amber") },
          buttons: [
            { count: 1, label: "1Y", step: "year", stepmode: "backward" },
            { count: 5, label: "5Y", step: "year", stepmode: "backward" },
            { count: 10, label: "10Y", step: "year", stepmode: "backward" },
            { step: "all", label: "MAX" },
          ],
        },
      },
      yaxis: { title: "US$ / barrel", gridcolor: css("--grid"), zerolinecolor: "#555", tickprefix: "$" },
      shapes: [],
      annotations: [],
    };

    Plotly.newPlot("chart", traces, layout, { responsive: true, displaylogo: false });

    // ---- The Major Events button -----------------------------------------
    const btn = document.getElementById("events-btn");
    btn.addEventListener("click", () => {
      const show = btn.getAttribute("aria-pressed") !== "true";
      btn.setAttribute("aria-pressed", String(show));
      Plotly.update("chart",
        { visible: show },
        {
          shapes: show ? eventShapes : [],
          annotations: show ? eventLabels : [],
          // Leave empty space above the prices so the red labels don't cover the lines.
          "yaxis.range": show ? [-45, 260] : null,
          "yaxis.autorange": !show,
        },
        [EVENT_TRACE]);
    });
  </script>
</body>
</html>
